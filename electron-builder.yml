appId: com.terracommander.app
productName: TerraCommander
directories:
  output: dist
files:
  - out/**/*
  - package.json
asar: true
win:
  executableName: TerraCommander
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: '${productName}-${version}-setup.${ext}'
portable:
  artifactName: '${productName}-${version}-portable.${ext}'
